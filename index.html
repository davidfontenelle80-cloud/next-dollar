<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <meta name="description" content="Next Dollar — Personal Financial Coach. Step-by-step EN/ES budget allocator." />
  <meta name="theme-color" content="#0b0d12" />

  <!-- PWA -->
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" type="image/svg+xml" href="icons/favicon.svg" />
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Next Dollar" />

  <!-- CSS — KHub standard layers -->
  <link rel="stylesheet" href="css/dark-mode.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/responsive.css" />
  <link rel="stylesheet" href="css/main.css" />

  <title>Next Dollar</title>
</head>
<body>

  <!-- KHub: Skip link (WCAG 2.2) -->
  <a class="skip-link" href="#main-content">Skip to main content</a>

  <!-- KHub: Update notice (SW new version waiting) -->
  <div id="update-notice"
       class="update-notice"
       role="status"
       aria-live="polite"
       aria-atomic="true"
       hidden>
    Update available — <button class="btn btn-sm btn-secondary"
            onclick="KHub.SW.applyUpdate()">Refresh</button>
  </div>

  <!-- KHub: Error boundary -->
  <div id="error-boundary"
       class="error-boundary"
       role="alert"
       aria-live="assertive"
       aria-atomic="true"
       tabindex="-1"
       hidden>
    <strong>Something went wrong</strong>
    <p id="error-message"></p>
    <button class="btn btn-sm btn-danger"
            onclick="KHub.ErrorBoundary.dismiss()">Dismiss</button>
  </div>

  <!-- App root (existing structure preserved) -->
  <div id="bg-wrap">
    <div class="orb orb-a"></div>
    <div class="orb orb-b"></div>
    <div class="orb orb-c"></div>
  </div>

  <main id="main-content" role="main" aria-label="Next Dollar App">
    <div id="app">
      <div class="app-header">
        <span class="app-logo">Next Dollar</span>
        <div class="header-controls">
          <button class="ctrl-btn" id="langBtn" onclick="toggleLang()" aria-label="Switch language">ES</button>
          <button class="ctrl-btn" id="themeBtn" onclick="cycleTheme()" aria-label="Toggle theme">&#127769;</button>
        </div>
      </div>

      <div class="progress-bar hidden" id="progressBar">
        <div class="prog-dot" id="dot0"></div><div class="prog-dot" id="dot1"></div>
        <div class="prog-dot" id="dot2"></div><div class="prog-dot" id="dot3"></div>
        <div class="prog-dot" id="dot4"></div><div class="prog-dot" id="dot5"></div>
      </div>


<!-- WELCOME -->
<div class="screen active" id="screen-welcome">
  <div style="padding-top:8px"></div>
  <div class="card card-strong">
    <div class="label-tag" id="lbl-tag"></div>
    <div class="welcome-logo">Next Dollar</div>
    <p class="subtitle" id="lbl-wsub"></p>
  </div>
  <div class="card">
    <h3 id="lbl-wyg" style="margin-bottom:12px"></h3>
    <div style="display:flex;flex-direction:column;gap:10px">
      <div style="display:flex;gap:12px;align-items:flex-start"><span style="font-size:19px;line-height:1.3;flex-shrink:0">&#9889;</span><div><div style="font-size:14px;font-weight:700" id="lbl-f1t"></div><div style="font-size:13px;color:var(--text-muted)" id="lbl-f1d"></div></div></div>
      <div style="display:flex;gap:12px;align-items:flex-start"><span style="font-size:19px;line-height:1.3;flex-shrink:0">&#127919;</span><div><div style="font-size:14px;font-weight:700" id="lbl-f2t"></div><div style="font-size:13px;color:var(--text-muted)" id="lbl-f2d"></div></div></div>
      <div style="display:flex;gap:12px;align-items:flex-start"><span style="font-size:19px;line-height:1.3;flex-shrink:0">&#128200;</span><div><div style="font-size:14px;font-weight:700" id="lbl-f3t"></div><div style="font-size:13px;color:var(--text-muted)" id="lbl-f3d"></div></div></div>
      <div style="display:flex;gap:12px;align-items:flex-start"><span style="font-size:19px;line-height:1.3;flex-shrink:0">&#128640;</span><div><div style="font-size:14px;font-weight:700" id="lbl-f4t"></div><div style="font-size:13px;color:var(--text-muted)" id="lbl-f4d"></div></div></div>
    </div>
  </div>
  <button class="btn btn-primary" id="btn-start" onclick="goTo(1)"></button>
  <div style="text-align:center"><label class="import-link" id="lbl-import" for="importFile"></label><input type="file" id="importFile" accept=".json" style="display:none" onchange="importPlan(event)"></div>
  <div class="card">
    <h3 style="margin-bottom:10px">Backup & restore</h3>
    <div class="actions-row">
      <button class="btn-action" type="button" onclick="exportPlan()">&#8681; Export JSON</button>
      <button class="btn-action" type="button" onclick="importPlanFromFile()">&#8679; Import file</button>
    </div>
  </div>
  <p class="disclaimer" id="lbl-noacct"></p>
</div>

<!-- STEP 1: INCOME -->
<div class="screen" id="screen-s1">
  <div class="card card-strong"><div class="label-tag" id="lbl-s1tag"></div><h2 id="lbl-s1h"></h2><p class="subtitle" id="lbl-s1sub"></p></div>
  <div class="card">
    <div style="display:flex;flex-direction:column;gap:12px">
      <div class="field-group"><div class="field-label" id="lbl-takehome"></div><div class="input-wrap has-prefix"><span class="input-prefix">$</span><input type="number" id="inp-takehome" min="0" placeholder="5000" inputmode="decimal"></div></div>
      <div class="field-group"><div class="field-label" id="lbl-payfreq"></div><select id="inp-payfreq"><option value="monthly" id="opt-monthly"></option><option value="semimonthly" id="opt-semimonthly"></option><option value="biweekly" id="opt-biweekly" selected></option><option value="weekly" id="opt-weekly"></option></select></div>
    </div>
    <div class="err-msg" id="err-s1"></div>
  </div>
  <div class="btn-row"><button class="btn btn-ghost" id="btn-b1" onclick="goTo(0)"></button><button class="btn btn-primary" id="btn-n1" onclick="nextS1()"></button></div>
</div>

<!-- STEP 2: EXPENSES -->
<div class="screen" id="screen-s2">
  <div class="card card-strong"><div class="label-tag" id="lbl-s2tag"></div><h2 id="lbl-s2h"></h2><p class="subtitle" id="lbl-s2sub"></p></div>
  <div class="card">
    <div style="display:flex;flex-direction:column;gap:12px">
      <div class="field-group"><div class="field-label" id="lbl-housing"></div><div class="input-wrap has-prefix"><span class="input-prefix">$</span><input type="number" id="inp-housing" min="0" placeholder="1500" inputmode="decimal"></div></div>
      <div class="field-group"><div class="field-label" id="lbl-food"></div><div class="input-wrap has-prefix"><span class="input-prefix">$</span><input type="number" id="inp-food" min="0" placeholder="600" inputmode="decimal"></div></div>
      <div class="field-group"><div class="field-label" id="lbl-transport"></div><div class="input-wrap has-prefix"><span class="input-prefix">$</span><input type="number" id="inp-transport" min="0" placeholder="400" inputmode="decimal"></div></div>
      <div class="field-group"><div class="field-label" id="lbl-utilities"></div><div class="input-wrap has-prefix"><span class="input-prefix">$</span><input type="number" id="inp-utilities" min="0" placeholder="200" inputmode="decimal"></div></div>
      <div class="field-group"><div class="field-label" id="lbl-funspend"></div><div class="input-wrap has-prefix"><span class="input-prefix">$</span><input type="number" id="inp-funspend" min="0" placeholder="300" inputmode="decimal"></div></div>
    </div>
    <div class="err-msg" id="err-s2"></div>
  </div>
  <div class="btn-row"><button class="btn btn-ghost" id="btn-b2" onclick="goTo(1)"></button><button class="btn btn-primary" id="btn-n2" onclick="nextS2()"></button></div>
</div>

<!-- STEP 3: DEBTS -->
<div class="screen" id="screen-s3">
  <div class="card card-strong"><div class="label-tag" id="lbl-s3tag"></div><h2 id="lbl-s3h"></h2><p class="subtitle" id="lbl-s3sub"></p></div>
  <div id="debt-list" style="display:flex;flex-direction:column;gap:10px"></div>
  <button class="btn-add" id="btn-add-debt" onclick="addDebt()"></button>
  <div class="card card-accent" id="surplus-preview" style="display:none"><div style="font-size:13px;color:var(--text-muted)" id="lbl-surplus-preview"></div><div style="font-size:22px;font-weight:900;margin-top:4px;letter-spacing:-.02em" id="surplus-val"></div></div>
  <div class="err-msg" id="err-s3" style="text-align:center"></div>
  <div class="btn-row"><button class="btn btn-ghost" id="btn-b3" onclick="goTo(2)"></button><button class="btn btn-primary" id="btn-n3" onclick="nextS3()"></button></div>
</div>

<!-- STEP 4: SAVINGS SNAPSHOT -->
<div class="screen" id="screen-s4">
  <div class="card card-strong"><div class="label-tag" id="lbl-s4tag"></div><h2 id="lbl-s4h"></h2><p class="subtitle" id="lbl-s4sub"></p></div>
  <div class="card">
    <div style="display:flex;flex-direction:column;gap:12px">
      <div class="field-group"><div class="field-label" id="lbl-cash"></div><div class="input-wrap has-prefix"><span class="input-prefix">$</span><input type="number" id="inp-cash" min="0" placeholder="1000" inputmode="decimal"></div></div>
      <div class="field-group"><div class="field-label" id="lbl-efund"></div><div class="input-wrap has-prefix"><span class="input-prefix">$</span><input type="number" id="inp-efund" min="0" placeholder="3000" inputmode="decimal"></div></div>
      <div class="field-group"><div class="field-label" id="lbl-retirement"></div><div class="input-wrap has-prefix"><span class="input-prefix">$</span><input type="number" id="inp-retirement" min="0" placeholder="25000" inputmode="decimal"></div></div>
      <div class="field-group"><div class="field-label" id="lbl-brokerage"></div><div class="input-wrap has-prefix"><span class="input-prefix">$</span><input type="number" id="inp-brokerage" min="0" placeholder="0" inputmode="decimal"></div></div>
    </div>
  </div>
  <div class="btn-row"><button class="btn btn-ghost" id="btn-b4" onclick="goTo(3)"></button><button class="btn btn-primary" id="btn-n4" onclick="nextS4()"></button></div>
</div>

<!-- STEP 5: BENEFITS + GOALS -->
<div class="screen" id="screen-s5">
  <div class="card card-strong"><div class="label-tag" id="lbl-s5tag"></div><h2 id="lbl-s5h"></h2><p class="subtitle" id="lbl-s5sub"></p></div>
  <div class="card">
    <div style="display:flex;flex-direction:column;gap:12px">
      <div class="toggle-group"><span class="toggle-label" id="lbl-hasmatch"></span><label class="toggle"><input type="checkbox" id="inp-hasmatch" onchange="toggleMatchFields()"><span class="toggle-slider"></span></label></div>
      <div id="match-fields" style="display:none;flex-direction:column;gap:10px">
        <div class="field-group"><div class="field-label" id="lbl-matchpct"></div><div class="input-wrap has-suffix"><input type="number" id="inp-matchpct" min="0" max="100" placeholder="100" inputmode="decimal"><span class="input-suffix">%</span></div></div>
        <div class="field-group"><div class="field-label" id="lbl-matchupto"></div><div class="input-wrap has-suffix"><input type="number" id="inp-matchupto" min="0" max="100" placeholder="4" inputmode="decimal"><span class="input-suffix">%</span></div></div>
        <div class="field-group"><div class="field-label" id="lbl-mycontrib"></div><div class="input-wrap has-suffix"><input type="number" id="inp-mycontrib" min="0" max="100" placeholder="3" inputmode="decimal"><span class="input-suffix">%</span></div></div>
      </div>
      <div class="toggle-group"><span class="toggle-label" id="lbl-hasroth"></span><label class="toggle"><input type="checkbox" id="inp-hasroth"><span class="toggle-slider"></span></label></div>
    </div>
  </div>
  <div class="card">
    <h3 id="lbl-goals-h" style="margin-bottom:12px"></h3>
    <div style="display:flex;flex-direction:column;gap:12px">
      <div class="field-group"><div class="field-label" id="lbl-retireage"></div><div class="input-wrap has-suffix"><input type="number" id="inp-retireage" min="40" max="75" placeholder="55" inputmode="decimal"><span class="input-suffix" id="lbl-yrs"></span></div></div>
      <div class="field-group"><div class="field-label" id="lbl-targetspend"></div><div class="input-wrap has-prefix"><span class="input-prefix">$</span><input type="number" id="inp-targetspend" min="0" placeholder="60000" inputmode="decimal"></div></div>
    </div>
  </div>
  <div class="btn-row"><button class="btn btn-ghost" id="btn-b5" onclick="goTo(4)"></button><button class="btn btn-primary" id="btn-n5" onclick="nextS5()"></button></div>
</div>

<!-- STEP 6: STYLE -->
<div class="screen" id="screen-s6">
  <div class="card card-strong"><div class="label-tag" id="lbl-s6tag"></div><h2 id="lbl-s6h"></h2><p class="subtitle" id="lbl-s6sub"></p></div>
  <div style="display:flex;flex-direction:column;gap:10px">
    <div class="p-option" id="opt-snowball" onclick="selectP('snowball')"><div class="p-icon">&#127942;</div><div class="p-text"><h3 id="lbl-p1h"></h3><p id="lbl-p1p"></p></div></div>
    <div class="p-option" id="opt-avalanche" onclick="selectP('avalanche')"><div class="p-icon">&#128176;</div><div class="p-text"><h3 id="lbl-p2h"></h3><p id="lbl-p2p"></p></div></div>
    <div class="p-option" id="opt-cashflow" onclick="selectP('cashflow')"><div class="p-icon">&#127754;</div><div class="p-text"><h3 id="lbl-p3h"></h3><p id="lbl-p3p"></p></div></div>
  </div>
  <div class="err-msg" id="err-s6" style="text-align:center"></div>
  <div class="btn-row"><button class="btn btn-ghost" id="btn-b6" onclick="goTo(5)"></button><button class="btn btn-primary" id="btn-n6" onclick="nextS6()"></button></div>
</div>

<!-- RESULTS -->
<div class="screen" id="screen-results" style="padding:0;gap:0">
  <!-- Tab panels -->
  <div class="results-screen active" id="tab-overview" style="padding-top:14px">
    <div class="card card-strong" style="text-align:center">
      <div class="label-tag" style="justify-content:center" id="lbl-score-tag"></div>
      <div class="score-wrap">
        <div class="score-ring-container"><svg class="score-ring-svg" viewBox="0 0 140 140"><circle class="score-ring-track" cx="70" cy="70" r="54"/><circle class="score-ring-fill" id="score-ring" cx="70" cy="70" r="54"/></svg><div class="score-center"><div class="score-num" id="score-num">0</div><div class="score-grade" id="score-grade"></div></div></div>
      </div>
      <div class="score-bars" id="score-bars"></div>
    </div>
    <div id="summary-strip"></div>
    <div class="insight-cards" id="insight-cards"></div>
    <!-- Paycheck splitter -->
    <div class="card">
      <div class="label-tag" id="lbl-paycheck-tag"></div>
      <h3 id="lbl-paycheck-h" style="margin-bottom:4px"></h3>
      <p class="subtitle" style="margin-bottom:12px" id="lbl-paycheck-sub"></p>
      <div class="field-group"><div class="input-wrap has-prefix"><span class="input-prefix">$</span><input type="number" id="inp-paycheck" placeholder="2500" inputmode="decimal" oninput="renderPaycheck()"></div></div>
      <div id="paycheck-rows"></div>
    </div>
    <!-- What-if -->
    <div class="card">
      <div class="label-tag" id="lbl-whatif-tag"></div>
      <h3 id="lbl-whatif-h" style="margin-bottom:4px"></h3>
      <p class="subtitle" style="margin-bottom:14px" id="lbl-whatif-sub"></p>
      <div class="field-group" style="margin-bottom:10px"><div class="field-label" id="lbl-whatif-slider"></div><input type="range" id="whatif-extra" min="0" max="500" step="25" value="0" oninput="renderWhatIf()"><div style="display:flex;justify-content:space-between;font-size:11px;color:var(--text-dim);margin-top:4px"><span>$0</span><span id="whatif-extra-val">$0/mo</span><span>$500</span></div></div>
      <div class="whatif-outputs" id="whatif-outputs"></div>
    </div>
  </div>

  <div class="results-screen" id="tab-debt">
    <div class="card card-strong" style="text-align:center"><div class="label-tag" id="lbl-debt-tag" style="text-align:center"></div><h2 id="res-headline"></h2><p class="subtitle" id="res-subhead"></p></div>
    <div id="debt-methods-container"></div>
  </div>

  <div class="results-screen" id="tab-ladder">
    <div class="card card-strong"><div class="label-tag" id="lbl-ladder-tag"></div><h2 id="lbl-ladder-h"></h2><p class="subtitle" id="lbl-ladder-sub"></p></div>
    <div class="ladder-list" id="ladder-rungs"></div>
    <div class="bridge-box" id="bridge-box"></div>
  </div>

  <div class="results-screen" id="tab-plan">
    <div class="card card-strong"><div class="label-tag" id="lbl-plan-tag"></div><h2 id="lbl-plan-h"></h2><p class="subtitle" id="lbl-plan-sub"></p></div>
    <div class="bucket-list" id="bucket-list"></div>
  </div>

  <div class="results-screen" id="tab-invest">
    <div class="card card-strong"><div class="label-tag" id="lbl-invest-tag"></div><h2 id="lbl-invest-h"></h2><p class="subtitle" id="lbl-invest-sub"></p></div>
    <div class="invest-section">
      <h3 id="lbl-acct-priority-h" style="font-size:14px;color:var(--text-muted)"></h3>
      <div class="priority-list" id="priority-list"></div>
      <div class="card">
        <div class="label-tag" id="lbl-alloc-tag"></div>
        <h3 id="lbl-alloc-h" style="margin-bottom:12px"></h3>
        <div class="alloc-grid" id="alloc-grid"></div>
      </div>
    </div>
  </div>

  <!-- Shared results footer -->
  <div style="width:100%;max-width:480px;padding:14px 20px;display:flex;flex-direction:column;gap:10px">
    <div class="actions-row">
      <button class="btn-action" onclick="exportPlan()">&#8681; <span id="lbl-export"></span></button>
      <button class="btn-action" onclick="importPlanFromFile()">&#8679; Import</button>
      <button class="btn-action" onclick="window.print()">&#128438; <span id="lbl-print"></span></button>
    </div>
    <p class="disclaimer" id="lbl-disc"></p>
    <button class="btn-restart" id="btn-restart" onclick="restart()"></button>
  </div>
</div>

<div class="app-footer"><span>Next Dollar</span><span>v2.0</span></div>
</div>

<!-- Bottom nav (results only) -->
<nav class="bottom-nav" id="bottomNav">
  <button class="nav-tab active" data-tab="overview" onclick="switchTab('overview')"><span class="nav-icon">&#9889;</span><span class="nav-label" id="nav-overview"></span></button>
  <button class="nav-tab" data-tab="debt" onclick="switchTab('debt')"><span class="nav-icon">&#128179;</span><span class="nav-label" id="nav-debt"></span></button>
  <button class="nav-tab" data-tab="ladder" onclick="switchTab('ladder')"><span class="nav-icon">&#128682;</span><span class="nav-label" id="nav-ladder"></span></button>
  <button class="nav-tab" data-tab="plan" onclick="switchTab('plan')"><span class="nav-icon">&#128200;</span><span class="nav-label" id="nav-plan"></span></button>
  <button class="nav-tab" data-tab="invest" onclick="switchTab('invest')"><span class="nav-icon">&#128640;</span><span class="nav-label" id="nav-invest"></span></button>
</nav>

    </div><!-- #app -->
  </main>

  <!-- JS load order: KHub infra first, then app -->
  <script src="js/config.js"></script>
  <script src="js/sw-register.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/error-boundary.js"></script>
  <script src="js/a11y.js"></script>
  <script src="js/components/button.js"></script>
  <script src="js/components/modal.js"></script>
  <script src="js/components/card.js"></script>
  <script src="js/components/input.js"></script>
  <script src="js/perf.js"></script>
  <script src="js/app.js"></script>

</body>
</html>
